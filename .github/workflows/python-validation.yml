name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app_v3.py modules pages
      - name: Import control module
        run: python -c "import modules.control_center; print('control module import OK')"
      - name: Run control workflow tests
        run: python -m unittest discover -s tests -v
      - name: Check dependency consistency
        run: pip check
